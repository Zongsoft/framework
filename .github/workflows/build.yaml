name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y fonts-dejavu-core

      - name: Install Cake
        run: dotnet tool install --global Cake.Tool

      - name: Make Cake script executable
        run: chmod +x ./cake.sh

      - name: Build and test
        timeout-minutes: 50
        run: ./cake.sh

      - name: Upload Net test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: net-test-diagnostics-${{ github.run_attempt }}
          path: Zongsoft.Net/TestResults/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 1
