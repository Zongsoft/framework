apiVersion: v1
kind: Pod
metadata:
  name: zongsoft.messaging.database.postgresql
  labels:
    app: zongsoft.messaging.database.postgresql
spec:
  containers:
    - name: postgres
      image: postgres:18.3
      ports:
        - containerPort: 5432
          protocol: TCP
          hostPort: 5432
      env:
        - name: TZ
          value: UTC
        - name: POSTGRES_USER
          value: program
        - name: POSTGRES_PASSWORD
          value: "xxxxxx"
        - name: POSTGRES_DB
          value: zongsoft
